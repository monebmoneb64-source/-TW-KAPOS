<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW-KAPOS | موقعي الشخصي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #3b0000 0%, #160000 30%, #050505 70%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      text-align: center;
      background: rgba(10, 10, 10, 0.92);
      border: 2px solid #e00000;
      border-radius: 28px;
      padding: 48px 28px;
      box-shadow:
        0 0 25px rgba(255, 0, 0, 0.25),
        0 20px 70px rgba(0, 0, 0, 0.8);
    }

    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff0000, #700000);
      border: 3px solid #ff1a1a;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }

    .tag {
      color: #ff2222;
      font-size: 18px;
      margin-bottom: 18px;
      font-weight: 700;
    }

    p {
      color: #ddd;
      line-height: 1.8;
      font-size: 17px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 30px;
    }

    a {
      text-decoration: none;
      color: white;
      padding: 15px;
      border-radius: 14px;
      background: #111;
      border: 1px solid #b00000;
      transition: 0.2s;
      font-weight: 700;
    }

    a:hover {
      transform: translateY(-3px);
      background: #c00000;
      border-color: #ff3333;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
    }

    .footer {
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 34px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 38px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar">TW</div>

    <h1>TW-KAPOS</h1>

    <div class="tag">موقعي الشخصي</div>

    <p>
      أهلاً بيك في موقعي 👋<br>
      هنا تقدر تعرفني أكثر وتلقى روابط حساباتي ومشاريعي.
    </p>

    <div class="buttons">
      <a href="#" target="_blank">🎮 حسابي</a>
      <a href="#" target="_blank">📱 تواصل معي</a>
      <a href="#" target="_blank">📸 Instagram</a>
      <a href="#" target="_blank">▶️ YouTube</a>
    </div>

    <div class="footer">
      © 2026 TW-KAPOS — جميع الحقوق محفوظة
    </div>
  </main>
</body>
</htm
