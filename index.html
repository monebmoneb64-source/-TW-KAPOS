<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW-KAPOS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #450000, #120000 35%, #030303 75%);
      color: white;
      min-height: 100vh;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .card {
      background: rgba(8, 8, 8, .96);
      border: 2px solid #d00000;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 0, 0, .25);
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 35px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff0000, #650000);
      border: 3px solid #ff2222;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .tag {
      color: #ff2020;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 20px;
    }

    p {
      color: #ddd;
      line-height: 1.8;
      font-size: 17px;
    }

    .login-btn,
    .logout-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 22px;
      background: linear-gradient(135deg, #ff0000, #8c0000);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-btn {
      background: #171717;
      border: 1px solid #b00000;
    }

    .wallet {
      margin-top: 25px;
      padding: 25px;
      border-radius: 22px;
      background: linear-gradient(145deg, #181818, #070707);
      border: 1px solid #8d6200;
    }

    .coin {
      width: 80px;
      height: 80px;
      margin: auto auto 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 38px;
      font-weight: 900;
      color: #ffd700;
      background: radial-gradient(circle, #fff2a6, #ffd700 35%, #9a6500);
      border: 4px solid #ffe27a;
    }

    .balance-label {
      color: #aaa;
      font-size: 14px;
    }

    .balance {
      color: #ffd700;
      font-size: 32px;
      font-weight: 900;
      margin-top: 5px;
    }

    .user {
      margin-top: 18px;
      color: #aaa;
    }

    .auth-box {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #101010;
      border: 1px solid #700000;
      border-radius: 20px;
    }

    .auth-box h2 {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 12px;
      border: 1px solid #555;
      background: #050505;
      color: white;
      font-size: 16px;
      direction: ltr;
    }

    .auth-action {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #d00000;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .switch {
      margin-top: 15px;
      color: #ff3030;
      cursor: pointer;
    }

    .message {
      margin-top: 12px;
      color: #ff7777;
      min-height: 20px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .buttons a {
      text-decoration: none;
      color: white;
      padding: 15px;
      border-radius: 14px;
      background: #111;
      border: 1px solid #b00000;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 34px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <main class="card">

    <div class="logo">TW</div>

    <h1>TW-KAPOS</h1>

    <div class="tag">موقعي الشخصي</div>

    <p>
      أهلاً بيك في موقعي 👋<br>
      سجّل دخولك باش تشوف حسابك ورصيد العملات الافتراضية.
    </p>

    <button class="login-btn" id="openLogin">
      🔐 تسجيل الدخول
    </button>

    <section class="auth-box" id="authBox">

      <h2 id="authTitle">تسجيل الدخول</h2>

      <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
      >

      <button class="auth-action" id="authButton">
        دخول
      </button>

      <div class="switch" id="switchMode">
        إنشاء حساب جديد
      </div>

      <div class="message" id="message"></div>

    </section>

    <section class="wallet" id="wallet" style="display:none;">

      <div class="coin">$</div>

      <div class="balance-label">
        رصيد العملات الافتراضية
      </div>

      <div class="balance">
        <span id="coins">0</span> 🪙
      </div>

      <div class="user">
        الحساب: <span id="userEmail"></span>
      </div>

      <button class="logout-btn" id="logoutButton">
        تسجيل الخروج
      </button>

    </section>

    <div class="buttons">

      <a href="#" target="_blank">🎮 حسابي</a>

      <a href="#" target="_blank">📱 تواصل معي</a>

      <a href="#" target="_blank">📸 Instagram</a>

      <a href="#" target="_blank">▶️ YouTube</a>

    </div>

    <div class="footer">
      © 2026 TW-KAPOS — جميع الحقوق محفوظة
    </div>

  </main>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyD6P4zOA4s3JdYide7EYd7GhWkaHC1IqYU",
    authDomain: "tw-kapos.firebaseapp.com",
    projectId: "tw-kapos",
    storageBucket: "tw-kapos.firebasestorage.app",
    messagingSenderId: "971379019777",
    appId: "1:971379019777:web:e2e05505f14e3f44603000",
    measurementId: "G-YZQST3S9BB"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  const openLogin =
    document.getElementById("openLogin");

  const authBox =
    document.getElementById("authBox");

  const authTitle =
    document.getElementById("authTitle");

  const authButton =
    document.getElementById("authButton");

  const switchMode =
    document.getElementById("switchMode");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const wallet =
    document.getElementById("wallet");

  const coins =
    document.getElementById("coins");

  const userEmail =
    document.getElementById("userEmail");

  const logoutButton =
    document.getElementById("logoutButton");


  let loginMode = true;


  openLogin.addEventListener("click", () => {

    authBox.style.display = "block";

    openLogin.style.display = "none";

  });


  switchMode.addEventListener("click", () => {

    loginMode = !loginMode;

    if (loginMode) {

      authTitle.textContent = "تسجيل الدخول";

      authButton.textContent = "دخول";

      switchMode.textContent = "إنشاء حساب جديد";

    } else {

      authTitle.textContent = "إنشاء حساب";

      authButton.textContent = "إنشاء الحساب";

      switchMode.textContent = "لدي حساب بالفعل";

    }

    message.textContent = "";

  });


  authButton.addEventListener("click", async () => {

    const userEmailValue =
      email.value.trim();

    const userPassword =
      password.value;


    if (!userEmailValue || !userPassword) {

      message.textContent =
        "اكتب البريد الإلكتروني وكلمة المرور.";

      return;

    }


    message.textContent = "جاري المعالجة...";


    try {

      if (loginMode) {

        await signInWithEmailAndPassword(
          auth,
          userEmailValue,
          userPassword
        );

      } else {

        const result =
          await createUserWithEmailAndPassword(
            auth,
            userEmailValue,
            userPassword
          );

        await setDoc(
          doc(db, "profiles", result.user.uid),
          {
            coins: 4000,
            email: userEmailValue
          }
        );

      }

      message.textContent = "";

    } catch (error) {

      message.textContent =
        "حدث خطأ: " + error.message;

    }

  });


  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      wallet.style.display = "none";

      return;

    }


    authBox.style.display = "none";

    openLogin.style.display = "none";

    wallet.style.display = "block";

    userEmail.textContent =
      user.email;


    const profileRef =
      doc(db, "profiles", user.uid);

    const profileSnap =
      await getDoc(profileRef);


    if (profileSnap.exists()) {

      const data =
        profileSnap.data();

      coins.textContent =
        data.coins;

    }

  });


  logoutButton.addEventListener("click", async () => {

    await signOut(auth);

    wallet.style.display = "none";

    openLogin.style.display = "block";

  });

</script>

</body>
</html>
